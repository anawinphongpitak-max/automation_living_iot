<!DOCTYPE html>
<html><head><title>API Test</title></head><body>
<h1>API Test</h1>
<pre id='output'></pre>
<script>
const testFetch = async () => {
  try {
    const response = await fetch('http://localhost:3000/api/history?limit=10');
    const data = await response.json();
    console.log('Status:', response.status);
    console.log('Success:', data.success);
    console.log('Data length:', data.data ? data.data.length : 0);
    console.log('First event:', data.data ? data.data[0] : null);
  } catch (error) {
    console.error('Error:', error);
  }
};
testFetch();
</script>
</body></html>
